name: Build and Release SmallCaps C++

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Build C++ Executable
        run: |
          windres resource.rc -O coff -o resource.res
          g++ -O3 -mwindows -s -static -std=c++17 main.cpp resource.res -luser32 -lgdi32 -lshell32 -lcomctl32 -lpsapi -ldwmapi -o SmallCaps.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallCaps-Windows-x64
          path: SmallCaps.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SmallCaps.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
